version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'
      frontend-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # workbox-build (used by vite-plugin-pwa to generate the service
      # worker) requires Babel ^7.0.0-0 and breaks the production build
      # under Babel 8. Revisit once workbox-build supports Babel 8.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:15'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    ignore:
      # cloudevents 2.x is capped out by functions-framework's own pin
      # (cloudevents<=1.12.0 as of functions-framework 3.10.2, the latest
      # release). Revisit once functions-framework lifts that cap.
      - dependency-name: 'cloudevents'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'pip'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:30'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    ignore:
      # cloudevents is capped at <=1.12.0 by functions-framework's own pin
      # (as of functions-framework 3.10.2, the latest release), so both
      # major (2.x) and minor (>=1.13.0) bumps are unresolvable. Revisit
      # once functions-framework lifts that cap.
      - dependency-name: 'cloudevents'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:45'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
