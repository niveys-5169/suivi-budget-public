name: Cleanup bank representation duplicates (opérations bancaires dupliquées)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation (liste les identifiants à supprimer sans toucher Firestore)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cleanup doublons Enable Banking
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "▶ Mode dry-run : aucune suppression ne sera effectuée."
            python src/cleanup_bank_representation_duplicates.py
          else
            echo "▶ Mode réel : suppression effective dans Firestore (sauvegarde dans bank_cleanup_backups)."
            python src/cleanup_bank_representation_duplicates.py --apply
          fi
