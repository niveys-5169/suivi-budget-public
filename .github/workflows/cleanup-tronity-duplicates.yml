name: Cleanup Tronity duplicates (recharges dupliquées)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'doublons : garde un exemplaire par session | non-pointees : supprime toutes les recharges non pointées'
        type: choice
        options:
          - doublons
          - non-pointees
        default: doublons
      dry_run:
        description: 'Simulation (affiche ce qui serait supprimé sans toucher Firestore)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cleanup recharges Tronity dupliquées
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "▶ Mode dry-run (${{ inputs.mode }}) : aucune suppression ne sera effectuée."
            python src/cleanup_tronity_duplicates.py --mode "${{ inputs.mode }}" --dry-run
          else
            echo "▶ Mode réel (${{ inputs.mode }}) : suppression effective dans Firestore."
            python src/cleanup_tronity_duplicates.py --mode "${{ inputs.mode }}"
          fi
