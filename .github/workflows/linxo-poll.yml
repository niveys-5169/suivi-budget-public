name: Poll Linxo email (fréquent)

on:
  # Planification désactivée : Gmail Push (voir docs/GMAIL_PUBSUB_SETUP.md)
  # importe désormais en quasi-instantané, et ce polling consommait des
  # minutes Actions pour un filet de sécurité redondant avec un déclenchement
  # manuel. Réactiver le schedule ci-dessous si Gmail Push retombe en panne
  # durablement :
  #   schedule:
  #     - cron: '*/120 4-22 * * *'
  workflow_dispatch:

# Empêche deux imports simultanés (évite tout double traitement).
concurrency:
  group: linxo-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: pip install -r requirements.txt
      - name: Import Linxo (Gmail → Firebase)
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          DISABLE_LINXO_IMPORT: ${{ vars.DISABLE_LINXO_IMPORT }}
        run: python src/importer.py
