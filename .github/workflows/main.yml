name: Import Linxo → Sheets/Firebase (quotidien)

on:
  repository_dispatch:
    # Déclenché depuis le dashboard via l'API GitHub (bouton "Rafraîchir mails")
    types: [import-linxo]
  schedule:
    # Tous les jours à 7h00 heure de Paris (6h UTC en hiver, 5h UTC en été)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permet aussi de lancer manuellement depuis GitHub
    inputs:
      disable_linxo_import:
        description: "Désactiver l'import Linxo"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restaurer processed_ids.json (dernier artefact disponible)
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295 # v9
        with:
          workflow: main.yml
          name: processed-ids
          path: .
          if_no_artifact_found: warn

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Python dependencies
        id: cache-python
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run import Gmail → Sheets/Firebase
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FORCE_DAILY_FULL_SCAN: ${{ github.event_name == 'schedule' && '1' || '' }}
          DISABLE_LINXO_IMPORT: ${{ github.event.inputs.disable_linxo_import || vars.DISABLE_LINXO_IMPORT }}
        run: python src/importer.py

      - name: Auto-catégorisation backend Firestore (règles + IA)
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python src/auto_categorize_backend.py

      - name: Sauvegarder processed_ids.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processed-ids
          path: processed_ids.json
          retention-days: 30
