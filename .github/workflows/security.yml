name: Security

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'functions/requirements.txt'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'functions/requirements.txt'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
  schedule:
    # Hebdomadaire : l'audit se déclenche déjà sur push/PR touchant les
    # manifests de dépendances, un scan quotidien est redondant.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Audit npm dependencies
        # Enveloppe `npm audit --audit-level=high` d'une liste d'exceptions
        # justifiées et datées — l'équivalent du `--ignore-vuln` que pip-audit
        # utilise déjà plus bas. Voir scripts/check-npm-audit.mjs.
        run: npm run check:audit

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            functions/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit root Python dependencies
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2025-183

      - name: Audit Firebase Functions dependencies
        run: python -m pip_audit -r functions/requirements.txt --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2024-271

