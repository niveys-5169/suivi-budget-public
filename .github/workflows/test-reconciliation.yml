name: Test Reconciliation Suite

on:
  push:
    branches: [main]
    paths:
      - 'functions/src/**'
      - 'functions/firebase_db.py'
      - 'tests/test_*.py'
      - '.github/workflows/test-reconciliation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/src/**'
      - 'functions/firebase_db.py'
      - 'tests/test_*.py'
      - '.github/workflows/test-reconciliation.yml'
  workflow_dispatch:

concurrency:
  group: test-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ce job reste volontairement sur GitHub-hosted, sans passer par CI_RUNNER :
  # sur le runner Windows self-hosted, actions/setup-python ne trouve pas
  # Python 3.11 dans son toolcache et relance l'installeur système. Il supprime
  # alors les entrées de désinstallation MSI du Python déjà présent sur la
  # machine, puis échoue ("Error happened during Python installation") — en
  # abîmant l'installation locale au passage.
  test-python:
    name: Python Tests (Cloud Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'functions/requirements.txt'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r functions/requirements.txt

      - name: Run Python tests
        shell: bash
        run: |
          python -m pytest tests/test_importer_balances.py tests/test_main_linxo_import.py tests/test_reconciliation_actions.py tests/test_firebase_db.py -v --tb=short

  coverage:
    name: Test Coverage Report
    needs: [test-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "All reconciliation tests completed ✅"
