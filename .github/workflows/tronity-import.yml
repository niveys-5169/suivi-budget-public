name: Import Tronity (recharges domicile) → Firebase

on:
  # Planification désactivée : consommait des minutes Actions quotidiennes
  # pour un import qui peut être déclenché à la demande (bouton dashboard ou
  # workflow_dispatch). Réactiver le schedule ci-dessous si besoin d'un
  # import automatique régulier :
  #   schedule:
  #     - cron: '0 6 * * *'
  workflow_dispatch:
    # Lancement manuel depuis l'UI GitHub
  repository_dispatch:
    # Déclenché depuis le dashboard via un bouton "Rafraîchir Tronity"
    types: [import-tronity]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  import:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import recharges domicile Tronity → Firebase
        env:
          TRONITY_CLIENT_ID: ${{ secrets.TRONITY_CLIENT_ID }}
          TRONITY_CLIENT_SECRET: ${{ secrets.TRONITY_CLIENT_SECRET }}
          TRONITY_VEHICLE_ID: ${{ secrets.TRONITY_VEHICLE_ID }}
          TRONITY_COMPTE: ${{ secrets.TRONITY_COMPTE }}
          TRONITY_HOME_LAT: ${{ secrets.TRONITY_HOME_LAT }}
          TRONITY_HOME_LON: ${{ secrets.TRONITY_HOME_LON }}
          TRONITY_HOME_RADIUS_KM: ${{ secrets.TRONITY_HOME_RADIUS_KM }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          # Fenêtre plus large lors du déclenchement automatique quotidien
          TRONITY_DAYS_LOOKBACK: ${{ github.event_name == 'schedule' && '60' || '30' }}
          TRONITY_DATE_FROM: ${{ github.event.client_payload.date_from || '' }}
          TRONITY_DATE_TO: ${{ github.event.client_payload.date_to || '' }}
        run: python src/tronity_importer.py

      - name: Notifier l'échec de l'import Tronity
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ Import Tronity en échec — ${new Date().toISOString().slice(0,10)}`,
              body: `L'import automatique des recharges Tronity a échoué (ou a été annulé par le timeout de 2 minutes).\n\n👉 [Voir les logs du run](${runUrl})\n\nVérifier :\n- que l'API Tronity \`https://api.tronity.tech\` est accessible\n- que les secrets \`TRONITY_CLIENT_ID\` / \`TRONITY_CLIENT_SECRET\` sont valides\n- les logs du run pour le détail de l'erreur`,
              labels: ['bug'],
            });
